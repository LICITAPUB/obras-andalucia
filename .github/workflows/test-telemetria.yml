name: Tests de telemetría PLACSP

on:
  push:
    branches:
      - fase-1/telemetria-historico
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar parser XML para Node.js
        run: npm install --no-save @xmldom/xmldom@0.9.8
      - name: Ejecutar pruebas Python y equivalencia JavaScript
        run: python -m unittest discover -s tests -v
