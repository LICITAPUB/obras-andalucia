name: Tests de telemetría PLACSP

on:
  push:
    branches:
      - fase-1/telemetria-historico
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar pruebas aisladas
        run: python -m unittest discover -s tests -v
