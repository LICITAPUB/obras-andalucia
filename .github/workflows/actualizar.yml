name: Actualizar obras

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      enrichment_limit:
        description: "Número máximo de expedientes a analizar"
        required: false
        default: "20"
        type: string
  push:
    branches: [main]
    paths: ["index.html", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar lote PLACSP (histórico reanudable y filtro > 1 millón)
        id: descarga
        timeout-minutes: 65
        run: |
          set -o pipefail
          python -u scripts/actualizar.py --max-pages 18 2>&1 | tee descarga.log
          if grep -q "INITIAL_COMPLETE=true" descarga.log; then
            echo "initial_complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "initial_complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Guardar progreso de descarga
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/obras.json data/placsp_checkpoint.json
          if ! git diff --cached --quiet; then
            git commit -m "Progreso de descarga PLACSP"
            git pull --rebase origin main
            git push
          fi

      - name: Instalar lector PDF
        if: steps.descarga.outputs.initial_complete == 'true'
        run: python -m pip install --disable-pip-version-check "pypdf[crypto]" fonttools

      - name: Analizar anuncios y pliegos PDF
        if: steps.descarga.outputs.initial_complete == 'true'
        timeout-minutes: 60
        run: python -u scripts/enriquecer.py --limit "${{ inputs.enrichment_limit || '20' }}" --refresh-days 30 --delay 0.3

      - name: Guardar enriquecimiento
        if: steps.descarga.outputs.initial_complete == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/obras.json
          if ! git diff --cached --quiet; then
            git commit -m "Enriquecimiento de licitaciones"
            git pull --rebase origin main
            git push
          fi

      - name: Preparar web
        if: steps.descarga.outputs.initial_complete == 'true'
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/

      - uses: actions/configure-pages@v5
        if: steps.descarga.outputs.initial_complete == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.descarga.outputs.initial_complete == 'true'
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
        if: steps.descarga.outputs.initial_complete == 'true'

      - name: Estado
        if: steps.descarga.outputs.initial_complete != 'true'
        run: echo "Histórico aún incompleto. Progreso guardado; la siguiente ejecución continuará desde el cursor."
