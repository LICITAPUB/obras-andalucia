name: LICITAPUB - actualizar y publicar

on:
  schedule:
    - cron: "30 5,11,17,23 * * *"
  workflow_dispatch:
    inputs:
      enrichment_limit:
        description: "Expedientes PDF a analizar (máximo)"
        required: false
        default: "20"
        type: string
      chain_depth:
        description: "Control interno de encadenamiento automático"
        required: false
        default: "0"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-guamar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar lote PLACSP y guardar cursor
        timeout-minutes: 60
        run: python -u scripts/actualizar.py --pages-per-run 12

      - name: Guardar datos y checkpoint en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/obras.json data/placsp_checkpoint.json data/placsp_status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Guardar lote de licitaciones y cursor"
            git pull --rebase origin main
            git push
          fi

      - name: Comprobar si el ciclo está completo
        id: estado
        run: echo "complete=$(test "$(cat data/placsp_status.txt)" = complete && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Instalar lector PDF
        if: steps.estado.outputs.complete == 'true'
        run: python -m pip install --disable-pip-version-check "pypdf[crypto]" fonttools

      - name: Analizar PDFs al completar el ciclo
        if: steps.estado.outputs.complete == 'true'
        timeout-minutes: 60
        run: python -u scripts/enriquecer.py --limit "${{ inputs.enrichment_limit || '20' }}" --refresh-days 30 --delay 0.3

      - name: Guardar análisis PDF
        if: steps.estado.outputs.complete == 'true'
        run: |
          git add data/obras.json
          if ! git diff --cached --quiet; then
            git commit -m "Enriquecer fichas de licitaciones"
            git pull --rebase origin main
            git push
          fi

      - name: Preparar publicación
        run: |
          mkdir -p _site
          cp index.html _site/
          cp detalle.html _site/
          cp carga.html _site/
          cp -r data _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Lanzar automáticamente el siguiente lote de 12 páginas
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PLACSP_DISPATCH_TOKEN }}
          CHAIN_DEPTH: ${{ inputs.chain_depth || '0' }}
          ENRICHMENT_LIMIT: ${{ inputs.enrichment_limit || '20' }}
        run: |
          STATUS="$(cat data/placsp_status.txt 2>/dev/null || echo pending)"
          MODE="$(python -c "import json; print(json.load(open('data/placsp_checkpoint.json', encoding='utf-8')).get('mode', ''))" 2>/dev/null || echo '')"

          if [ "$STATUS" = "complete" ] || [ "$MODE" != "initial" ]; then
            echo "La carga histórica inicial ha terminado."
            exit 0
          fi

          if [ -z "$GH_TOKEN" ]; then
            echo "Falta PLACSP_DISPATCH_TOKEN. No se puede encadenar."
            exit 0
          fi

          if [ "$CHAIN_DEPTH" -ge 50 ]; then
            echo "Límite de seguridad de 50 ejecuciones alcanzado."
            exit 0
          fi

          NEXT_DEPTH=$((CHAIN_DEPTH + 1))
          echo "Lanzando lote encadenado $NEXT_DEPTH de 50."

          gh workflow run actualizar.yml --ref main \
            -f chain_depth="$NEXT_DEPTH" \
            -f enrichment_limit="$ENRICHMENT_LIMIT"
